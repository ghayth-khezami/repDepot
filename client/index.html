<!doctype html>
<html lang="fr">
  <head>
    <script>
      (function () {
        try {
          var v = localStorage.getItem('depot-backoffice-theme-v');
          if (v !== '2') {
            localStorage.setItem('depot-backoffice-theme', 'light');
            localStorage.setItem('depot-backoffice-theme-v', '2');
          }
          var t = localStorage.getItem('depot-backoffice-theme');
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/depot.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8b4d9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BÉBÉ-DÉPÔT - Back Office</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/react-datepicker/dist/react-datepicker.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
