<!doctype html>
<html lang="fr">
  <head>
    <script>
      (function () {
        try {
          var v = localStorage.getItem('depot-backoffice-theme-v');
          if (v !== '2') {
            localStorage.setItem('depot-backoffice-theme', 'light');
            localStorage.setItem('depot-backoffice-theme-v', '2');
          }
          var t = localStorage.getItem('depot-backoffice-theme');
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/app-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BebeDepot" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3FD" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BÉBÉ-DÉPÔT - Back Office</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/react-datepicker/dist/react-datepicker.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
