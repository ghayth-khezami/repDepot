# Render Blueprint — API only (database on Neon, free past 30 days)
# Dashboard → New → Blueprint → connect repo → set Root Directory: server (or use this file at repo root)
#
# Do NOT create Render Postgres on the free tier — it expires after 30 days.
# Create Neon first, then paste DATABASE_URL in Render env vars.

services:
  - type: web
    name: depot-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: >-
      npm install -g pnpm@10.27.0 &&
      pnpm install --frozen-lockfile &&
      pnpm prisma generate &&
      pnpm build
    startCommand: npm run prisma:migrate:prod && npm run seed:categories && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: bebe-depot
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WEB_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MOBILE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@bebe-depot.com
